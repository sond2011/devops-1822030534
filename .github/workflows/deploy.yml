name: Check and Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check website files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Verify required files and HTML title
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "::error::Thiếu file bắt buộc: $file"
              exit 1
            fi
          done
          if ! grep -Eiq '<title([[:space:]>])' index.html; then
            echo "::error::index.html chưa có thẻ <title>"
            exit 1
          fi
          echo "Kiểm tra thành công: đủ 3 file và có thẻ title."

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
